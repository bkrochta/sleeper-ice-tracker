name: Update Ice Tracker

on:
  schedule:
    # Tuesday morning – lock the previous week
    - cron: '0 12 * * 2'            # Tue 8am ET

  workflow_dispatch:             # Manual trigger anytime

permissions:
  contents: write                # needed so we can commit history
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ices and generate site
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
        run: python scripts/fetch_ices.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit history (only when week is over)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/COMMIT_HISTORY ]; then
            echo "Week is finalized – committing history"
            git add data/season_ices.json docs/data.json
            git commit -m "Lock week history – season ice totals updated" || echo "No changes to commit"
            git push
            rm -f data/COMMIT_HISTORY
          else
            echo "Week still in progress – skipping history commit"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4